# SHClearChat : nettoie le chat en envoyant 100 lignes vides.
#
# Commandes :
#   /clearchat (alias /cc)    Nettoie le chat de tous les joueurs (sauf shclearchat.bypass) et l'annonce.
#   /clearchat self           Nettoie son propre chat. Aucune permission : tous les joueurs peuvent l'utiliser.
#   /clearchat <joueur>       Nettoie le chat d'un joueur.
#   /shclearchat reload       Relit config.yml et messages.yml. Si l'un des deux est invalide, rien n'est remplacé
#                             et le message donne le fichier et l'erreur. reseau.actif demande un redémarrage.
#
# Permissions (op par défaut) :
#   shclearchat.use            /clearchat (nettoyage général)
#   shclearchat.bypass         Chat épargné par le nettoyage général
#   shclearchat.other          /clearchat <joueur>
#   shclearchat.admin          Toutes les sous-commandes de /shclearchat
#   shclearchat.admin.reload   /shclearchat reload
#
# Les textes sont dans messages.yml.

# Avec SHNetwork, le nettoyage général atteint les joueurs de tous les serveurs du réseau, et /clearchat <joueur>
# trouve un joueur connecté sur un autre serveur. Sans SHNetwork, ou à false, seuls les joueurs de ce serveur sont
# atteints. Se lit au démarrage.
reseau:
  actif: true
