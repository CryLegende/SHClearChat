name: SHClearChat
version: '${project.version}'
main: org.Cry_Legende.sHClearChat.SHClearChat
api-version: '1.20'
author: Cry_Legende

commands:
  clearchat:
    description: Commande pour nettoyer le chat
    usage: /clearchat [self|player]
    aliases: [cc]

permissions:
  shclearchat.use:
    description: Permet d'utiliser la commande clearchat
    default: op
  shclearchat.bypass:
    description: Permet d'éviter le nettoyage du chat global
    default: op
  shclearchat.other:
    description: Permet de nettoyer le chat d'autres joueurs
    default: op
